<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>WDS Finance</title>
<meta name="theme-color" content="#155F4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WDS Finance">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5F3EC;
    --surface:#FFFFFF;
    --ink:#1E231C;
    --ink-muted:#6B7062;
    --line:#E3DFD1;
    --accent:#155F4A;
    --accent-soft:#E1EEE6;
    --income:#1E7A4C;
    --income-soft:#E5F3EA;
    --expense:#B23E28;
    --expense-soft:#FBEAE5;
    --transfer:#33547A;
    --transfer-soft:#E7EDF4;
    --radius:10px;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit;}
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0;font-weight:600;}
  button{cursor:pointer;}

  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--line);padding:22px 14px;
    display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px;}
  .brand-mark{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#fff;border:1px solid var(--line);}
  .brand-title{font-size:14.5px;font-weight:700;line-height:1.2;}
  .brand-sub{font-size:11.5px;color:var(--ink-muted);line-height:1.2;margin-top:2px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-btn{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;
    border:none;background:transparent;text-align:left;font-weight:500;color:var(--ink-muted);
    border-left:3px solid transparent;
  }
  .nav-btn:hover{background:#F1EFE6;}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent);border-left:3px solid var(--accent);font-weight:600;}

  .main-col{flex:1;min-width:0;padding:22px 26px 90px;max-width:1180px;}
  .accounts-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;}
  .account-chip{
    min-width:172px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 15px;flex-shrink:0;
  }
  .account-chip .a-name{font-size:12.5px;color:var(--ink-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .account-chip .a-bal{font-size:18px;font-weight:600;margin-top:4px;}
  .account-chip .a-bal.neg{color:var(--expense);}
  .account-chip .a-cur{font-size:11px;color:var(--ink-muted);margin-top:2px;letter-spacing:.02em;}

  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .page-head h2{font-size:20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:820px){.grid-2{grid-template-columns:1fr;}}

  .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;}
  .btn:hover{background:#F1EFE6;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#0f4d3c;}
  .btn-danger{background:var(--expense);border-color:var(--expense);color:#fff;}
  .btn-danger:hover{background:#8f321f;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);padding:6px 8px;font-weight:500;}
  .btn-ghost:hover{background:#F1EFE6;color:var(--ink);}
  .btn-sm{padding:6px 10px;font-size:13px;}
  .btn-link{background:none;border:none;color:var(--accent);font-weight:600;padding:2px 4px;text-decoration:underline;}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-muted);margin-bottom:5px;}
  .field{margin-bottom:14px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#FCFBF8;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  textarea{resize:vertical;min-height:64px;}
  .field-error{color:var(--expense);font-size:12px;margin-top:4px;display:none;}
  .field.has-error input,.field.has-error select{border-color:var(--expense);}
  .field.has-error .field-error{display:block;}
  .amount-row{display:flex;align-items:center;gap:8px;}
  .currency-tag{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;padding:9px 10px;border-radius:8px;white-space:nowrap;}
  .inline-add{display:none;gap:8px;margin-top:8px;}
  .inline-add input{flex:1;}

  .segmented{display:flex;background:#F1EFE6;border-radius:9px;padding:4px;gap:4px;margin-bottom:18px;}
  .segmented button{flex:1;border:none;background:transparent;padding:9px 8px;border-radius:7px;font-weight:600;color:var(--ink-muted);}
  .segmented button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:11.5px;text-transform:none;color:var(--ink-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  .big-rows td{font-size:16px;padding:8px 10px;}
  .big-rows th{font-size:12.5px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFAF6;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge-income{background:var(--income-soft);color:var(--income);}
  .badge-expense{background:var(--expense-soft);color:var(--expense);}
  .badge-transfer{background:var(--transfer-soft);color:var(--transfer);}
  .amt-income{color:var(--income);font-weight:600;}
  .amt-expense{color:var(--expense);font-weight:600;}
  .amt-transfer{color:var(--transfer);font-weight:600;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .empty-state{padding:38px 20px;text-align:center;color:var(--ink-muted);}
  .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
  .filters-bar .field{margin-bottom:0;min-width:140px;}
  .filters-bar .field.grow{flex:1;min-width:180px;}

  .chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:7px 8px 7px 14px;font-weight:600;font-size:13.5px;}
  .chip button{background:none;border:none;color:var(--accent);font-weight:700;width:20px;height:20px;border-radius:50%;line-height:1;}
  .chip button:hover{background:rgba(21,95,74,.15);}
  .add-row{display:flex;gap:8px;max-width:420px;}
  .add-row input{flex:1;}

  .fab{
    position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;font-size:30px;font-weight:400;
    box-shadow:0 6px 18px rgba(21,95,74,.35);line-height:1;z-index:40;
  }
  .fab:hover{background:#0f4d3c;}

  .modal-root{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(20,20,16,.45);z-index:80;padding:26px 14px;overflow-y:auto;}
  .modal-root.open{display:flex;}
  .modal-panel{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:560px;margin:auto;}
  .modal-panel h3{font-size:18px;margin-bottom:16px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .img-modal-panel{background:transparent;max-width:90vw;padding:0;text-align:center;}
  .img-modal-panel img{max-width:100%;max-height:80vh;border-radius:10px;background:#fff;}
  .img-modal-panel .btn{margin-top:14px;}

  .img-preview{margin-top:8px;display:flex;align-items:center;gap:10px;}
  .img-preview img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}

  .toast-root{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:#1E231C;color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:500;box-shadow:0 6px 16px rgba(0,0,0,.25);}

  .summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
  .summary-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;}
  .summary-card .s-label{font-size:12px;color:var(--ink-muted);font-weight:600;}
  .summary-card .s-in{color:var(--income);font-weight:700;font-size:15px;margin-top:6px;}
  .summary-card .s-out{color:var(--expense);font-weight:700;font-size:15px;margin-top:2px;}

  .acct-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;}
  .acct-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}

  .calc-panel{max-width:300px;}
  .calc-display{background:#1E231C;color:#fff;border-radius:10px;padding:20px 16px;text-align:right;font-size:30px;font-weight:600;margin-bottom:14px;overflow-x:auto;white-space:nowrap;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .calc-btn{padding:16px 0;border-radius:10px;border:1px solid var(--line);background:#FCFBF8;font-size:17px;font-weight:600;}
  .calc-btn:hover{background:#F1EFE6;}
  .calc-btn.calc-op{background:var(--accent-soft);color:var(--accent);}
  .calc-btn.calc-eq{background:var(--accent);color:#fff;border-color:var(--accent);grid-column:span 2;}
  .calc-btn.calc-zero{grid-column:span 2;}

  .imp-ok{color:var(--income);font-weight:600;font-size:12.5px;}
  .imp-err{color:var(--expense);font-weight:600;font-size:12.5px;}
  .imp-preview-wrap{max-height:360px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px;}
  .imp-preview-wrap table{font-size:12.5px;}
  .imp-preview-wrap thead th{position:sticky;top:0;background:var(--surface);}

  @media (max-width:780px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;overflow-x:auto;padding:12px 14px;border-right:none;border-bottom:1px solid var(--line);z-index:20;}
    .brand{flex-shrink:0;}
    .nav{flex-direction:row;}
    .nav-btn{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
    .nav-btn.active{border-left:none;border-bottom:3px solid var(--accent);}
    .main-col{padding:18px 14px 90px;}
  }
</style>

function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9); }
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtCurrency(amount, currency){
  var n = Number(amount)||0;
  try{
    return new Intl.NumberFormat('es-CR', {style:'currency', currency: currency || 'USD', minimumFractionDigits:2, maximumFractionDigits:2}).format(n);
  }catch(e){
    return (currency||'')+' '+n.toFixed(2);
  }
}
function fmtDate(iso){
  if(!iso) return '';
  var parts = iso.split('-');
  if(parts.length!==3) return iso;
  return parts[2]+'/'+parts[1]+'/'+parts[0];
}

/* ---------------------------------------------------------
   Motor de almacenamiento local (independiente de Claude)
   Usa IndexedDB (mejor para datos grandes/imágenes) con
   respaldo automático a localStorage si el navegador no
   admite IndexedDB en este contexto.
--------------------------------------------------------- */
var storage = (function(){
  var DB_NAME = 'wds_finance_db';
  var STORE = 'kv';
  var idbPromise = null;
  var idbBroken = false;

  function openDB(){
    if(idbPromise) return idbPromise;
    idbPromise = new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error('IndexedDB no disponible')); return; }
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject((e.target && e.target.error) || new Error('Error abriendo IndexedDB')); };
      req.onblocked = function(){ reject(new Error('IndexedDB bloqueada')); };
    });
    return idbPromise;
  }
  function idbOp(mode, fn){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, mode);
        var store = tx.objectStore(STORE);
        var req = fn(store);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }

  return {
    get: async function(key){
      if(!idbBroken){
        try{
          var v = await idbOp('readonly', function(store){ return store.get(key); });
          if(v===undefined) throw new Error('not found');
          return {key:key, value:v};
        }catch(e){
          if(e && e.message==='not found') throw e;
          idbBroken = true; // el navegador no soporta IndexedDB aquí: usar respaldo
        }
      }
      var raw = localStorage.getItem('wds_'+key);
      if(raw===null) throw new Error('not found');
      return {key:key, value:raw};
    },
    set: async function(key, value){
      if(!idbBroken){
        try{
          await idbOp('readwrite', function(store){ return store.put(value, key); });
          return {key:key, value:value};
        }catch(e){ idbBroken = true; }
      }
      try{ localStorage.setItem('wds_'+key, value); return {key:key, value:value}; }
      catch(e){ return null; }
    },
    delete: async function(key){
      if(!idbBroken){
        try{
          await idbOp('readwrite', function(store){ return store.delete(key); });
          return {key:key, deleted:true};
        }catch(e){ idbBroken = true; }
      }
      try{ localStorage.removeItem('wds_'+key); return {key:key, deleted:true}; }
      catch(e){ return null; }
    }
  };
})();

/* ---------------------------------------------------------
   Estado y persistencia
--------------------------------------------------------- */
var KEYS = {
  accounts: 'accounts',
  catIncome: 'categories_income',
  catExpense: 'categories_expense',
  suppliers: 'suppliers',
  transactions: 'transactions'
};

var state = { accounts:[], catIncome:[], catExpense:[], suppliers:[], transactions:[] };
var ui = {
  tab:'resumen',
  filters:{ account:'all', kind:'all', from:'', to:'', q:'' },
  transferFilters:{ account:'all' },
  pendingDeleteKey:null
};
var modalState = {};
var autoBackupEnabled = true;

function defaultData(){
  return {
    accounts: [
      {id:uid(), name:'Caja Colones', currency:'CRC', initialBalance:0},
      {id:uid(), name:'Cuenta Dólares', currency:'USD', initialBalance:0},
      {id:uid(), name:'Cuenta Euros', currency:'EUR', initialBalance:0},
      {id:uid(), name:'Cuenta Pesos MXN', currency:'MXN', initialBalance:0},
      {id:uid(), name:'Cuenta Libras', currency:'GBP', initialBalance:0}
    ],
    catIncome: ['Ventas','Servicios prestados','Ingresos financieros','Otros ingresos'],
    catExpense: ['Compras a proveedores','Servicios públicos','Alquiler','Planilla y salarios','Transporte','Otros gastos'],
    suppliers: [],
    transactions: []
  };
}

async function loadState(){
  var defaults = defaultData();
  for(var stateKey in KEYS){
    var storageKey = KEYS[stateKey];
    try{
      var res = await storage.get(storageKey, false);
      state[stateKey] = res ? JSON.parse(res.value) : defaults[stateKey];
      if(!res){ await storage.set(storageKey, JSON.stringify(defaults[stateKey]), false); }
    }catch(e){
      state[stateKey] = defaults[stateKey];
      try{ await storage.set(storageKey, JSON.stringify(defaults[stateKey]), false); }catch(e2){ console.error('No se pudo inicializar', storageKey, e2); }
    }
  }
  try{
    var abRes = await storage.get('auto_backup_enabled', false);
    autoBackupEnabled = abRes.value !== 'false';
  }catch(e){ autoBackupEnabled = true; }
}

async function maybeAutoBackupToDevice(){
  try{
    if(!autoBackupEnabled) return;
    if(state.accounts.length===0 && state.transactions.length===0) return;
    var today = todayISO();
    var lastRes;
    try{ lastRes = await storage.get('auto_backup_last_date', false); }catch(e){ lastRes = null; }
    if(lastRes && lastRes.value === today) return;
    var backup = await collectFullBackup();
    var blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'wds-finance-auto-backup-'+today+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    await storage.set('auto_backup_last_date', today, false);
    showToast('Copia de seguridad automática del día guardada en Descargas.');
  }catch(e){ console.error('Falló el respaldo automático', e); }
}

async function persist(stateKey){
  try{
    var res = await storage.set(KEYS[stateKey], JSON.stringify(state[stateKey]), false);
    if(!res){ showToast('No se pudo guardar el cambio. Intente de nuevo.'); }
    return !!res;
  }catch(e){ console.error(e); showToast('Error al guardar los datos.'); return false; }
}
async function saveImage(txId, dataUrl){
  try{ await storage.set('img_'+txId, dataUrl, false); }catch(e){ console.error(e); showToast('No se pudo guardar la imagen adjunta.'); }
}
async function getImage(txId){
  try{ var res = await storage.get('img_'+txId, false); return res? res.value : null; }catch(e){ return null; }
}
async function deleteImageKey(txId){
  try{ await storage.delete('img_'+txId, false); }catch(e){ /* puede no existir */ }
}

/* ---------------------------------------------------------
   Cálculos de negocio
--------------------------------------------------------- */
function getAccount(id){ return state.accounts.find(function(a){ return a.id===id; }); }

function accountBalance(accId){
  var acc = getAccount(accId);
  if(!acc) return 0;
  var bal = Number(acc.initialBalance)||0;
  state.transactions.forEach(function(t){
    if(t.kind==='income' && t.accountId===accId) bal += t.amount;
    else if(t.kind==='expense' && t.accountId===accId) bal -= t.amount;
    else if(t.kind==='transfer'){
      if(t.accountId===accId) bal -= t.amount;
      if(t.toAccountId===accId) bal += (t.destAmount!=null? t.destAmount : t.amount);
    }
  });
  return Math.round(bal*100)/100;
}

function isAccountInUse(accId){
  return state.transactions.some(function(t){ return t.accountId===accId || t.toAccountId===accId; });
}

function monthlySummaryByCurrency(){
  var ym = todayISO().slice(0,7);
  var map = {};
  state.transactions.forEach(function(t){
    if((t.kind==='income'||t.kind==='expense') && t.date && t.date.slice(0,7)===ym){
      var acc = getAccount(t.accountId);
      if(!acc) return;
      if(!map[acc.currency]) map[acc.currency] = {income:0, expense:0};
      if(t.kind==='income') map[acc.currency].income += t.amount;
      else map[acc.currency].expense += t.amount;
    }
  });
  return map;
}

  '</div>';

    } else {
      state.accounts.push({id:uid(), name:name, currency:currency, initialBalance:Math.round(balance*100)/100});

    await persist('accounts');
    closeModal();
    renderApp();
    showToast('Cuenta guardada.');
  });
}

async function collectFullBackup(){
  var images = {};
  var withImg = state.transactions.filter(function(t){ return t.hasImage; });
  for(var i=0;i<withImg.length;i++){
    var t = withImg[i];
    var dataUrl = await getImage(t.id);
    if(dataUrl) images[t.id] = dataUrl;
  }
  return {
    app:'WDS Finance', version:1, exportedAt:new Date().toISOString(),
    accounts: state.accounts, catIncome: state.catIncome, catExpense: state.catExpense,
    suppliers: state.suppliers, transactions: state.transactions, images: images
  };
}

function wireRespaldoTab(){
  document.getElementById('auto-backup-toggle').addEventListener('change', async function(){
    autoBackupEnabled = this.checked;
    try{ await storage.set('auto_backup_enabled', autoBackupEnabled ? 'true' : 'false', false); }catch(e){ console.error(e); }
    showToast(autoBackupEnabled ? 'Respaldo automático diario activado.' : 'Respaldo automático diario desactivado.');
  });
  document.getElementById('btn-export').addEventListener('click', async function(){
    var btn = this;
    btn.disabled = true; btn.textContent = 'Preparando…';
    try{
      var backup = await collectFullBackup();
      var blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var stamp = todayISO();
      a.href = url; a.download = 'wds-finance-backup-'+stamp+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      showToast('Copia de seguridad descargada.');
    }catch(e){ console.error(e); showToast('No se pudo generar la copia de seguridad.'); }
    btn.disabled = false; btn.textContent = 'Descargar copia de seguridad (.json)';
  });

  document.getElementById('btn-share-backup').addEventListener('click', async function(){
    var btn = this;
    btn.disabled = true; btn.textContent = 'Preparando…';
    try{
      var backup = await collectFullBackup();
      var stamp = todayISO();
      var fileName = 'wds-finance-backup-'+stamp+'.json';
      var file = new File([JSON.stringify(backup)], fileName, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Copia de seguridad WDS Finance', text:'Copia de seguridad del '+stamp});
      } else {
        // Sin soporte para compartir archivos: se descarga normalmente y se avisa cómo subirlo a Drive a mano.
        var blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        showToast('Su navegador no admite compartir directo: se descargó a Descargas. Ábralo desde la app de Drive para subirlo.');
      }
    }catch(e){
      if(e && e.name === 'AbortError'){ /* el usuario cerró el selector, no es un error */ }
      else { console.error(e); showToast('No se pudo compartir la copia de seguridad.'); }
    }
    btn.disabled = false; btn.textContent = 'Compartir / Guardar en Drive…';
  });

  var fileInput = document.getElementById('import-file');
  var importBtn = document.getElementById('btn-import');
  var pendingBackup = null;
  fileInput.addEventListener('change', function(){
    var file = fileInput.files[0];
    pendingBackup = null;
    importBtn.disabled = true;
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        if(!data || !Array.isArray(data.accounts) || !Array.isArray(data.transactions)){
          showToast('El archivo no parece una copia de seguridad válida.');
          return;
        }
        pendingBackup = data;
        importBtn.disabled = false;
      }catch(err){ showToast('No se pudo leer el archivo (¿es un .json válido?).'); }
    };
    reader.readAsText(file);
  });
  importBtn.addEventListener('click', async function(){
    if(!pendingBackup) return;
    importBtn.disabled = true; importBtn.textContent = 'Restaurando…';
    try{
      state.accounts = pendingBackup.accounts || [];
      state.catIncome = pendingBackup.catIncome || [];
      state.catExpense = pendingBackup.catExpense || [];
      state.suppliers = pendingBackup.suppliers || [];
      state.transactions = pendingBackup.transactions || [];
      await persist('accounts'); await persist('catIncome'); await persist('catExpense');
      await persist('suppliers'); await persist('transactions');
      var images = pendingBackup.images || {};
      for(var id in images){ await saveImage(id, images[id]); }
      ui.tab = 'resumen';
      renderApp();
      showToast('Datos restaurados correctamente.');
    }catch(e){ console.error(e); showToast('Ocurrió un error al restaurar los datos.'); }
    importBtn.disabled = false; importBtn.textContent = 'Restaurar desde archivo';
  });

  wireBulkImportSection();
  wireDeleteDataSection();
}

/* ---------------------------------------------------------
   BORRAR DATOS (conjunto filtrado o reinicio total)
--------------------------------------------------------- */
function matchesDeleteFilter(t, f){
  if(f.kind==='movements' && t.kind==='transfer') return false;
  if(f.kind==='income' && t.kind!=='income') return false;
  if(f.kind==='expense' && t.kind!=='expense') return false;
  if(f.kind==='transfer' && t.kind!=='transfer') return false;
  if(f.account!=='all'){
    if(t.kind==='transfer'){ if(t.accountId!==f.account && t.toAccountId!==f.account) return false; }
    else { if(t.accountId!==f.account) return false; }
  }
  if(f.from && t.date < f.from) return false;
  if(f.to && t.date > f.to) return false;
  return true;
}
function currentDeleteFilter(){
  return {
    account: document.getElementById('del-flt-account').value,
    kind: document.getElementById('del-flt-kind').value,
    from: document.getElementById('del-flt-from').value,
    to: document.getElementById('del-flt-to').value
  };
}
var delFilteredPendingConfirm = false;

function refreshDeleteFilterUI(){
  var f = currentDeleteFilter();
  var matches = state.transactions.filter(function(t){ return matchesDeleteFilter(t, f); });
  var countBox = document.getElementById('del-flt-count');
  var actionsBox = document.getElementById('del-flt-actions');
  countBox.innerHTML = '<strong class="num">'+matches.length+'</strong> '+(matches.length===1?'movimiento coincide con estos filtros.':'movimientos coinciden con estos filtros.');
  if(delFilteredPendingConfirm && matches.length>0){
    actionsBox.innerHTML = '<button class="btn btn-danger btn-sm" id="del-flt-confirm">Confirmar: eliminar '+matches.length+'</button>'+
      '<button class="btn btn-sm" id="del-flt-cancel">Cancelar</button>';
    document.getElementById('del-flt-confirm').addEventListener('click', async function(){
      var f2 = currentDeleteFilter();
      var toDelete = state.transactions.filter(function(t){ return matchesDeleteFilter(t, f2); });
      var keepSet = {};
      state.transactions.forEach(function(t){ if(!matchesDeleteFilter(t, f2)) keepSet[t.id]=true; });
      var deletedCount = toDelete.length;
      for(var i=0;i<toDelete.length;i++){ if(toDelete[i].hasImage){ await deleteImageKey(toDelete[i].id); } }
      state.transactions = state.transactions.filter(function(t){ return keepSet[t.id]; });
      await persist('transactions');
      delFilteredPendingConfirm = false;
      renderApp();
      showToast(deletedCount+' movimientos eliminados.');
    });
    document.getElementById('del-flt-cancel').addEventListener('click', function(){
      delFilteredPendingConfirm = false; refreshDeleteFilterUI();
    });
  } else {
    actionsBox.innerHTML = '<button class="btn btn-danger btn-sm" id="del-flt-start" '+(matches.length===0?'disabled':'')+'>Eliminar estos movimientos</button>';
    var startBtn = document.getElementById('del-flt-start');
    if(startBtn) startBtn.addEventListener('click', function(){ delFilteredPendingConfirm = true; refreshDeleteFilterUI(); });
  }
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
var HEADER_MAP = {
  'fecha':'fecha',
  'tipo':'tipo',
  'cuenta':'cuenta',
  'categoria':'categoria',
  'proveedor':'party','cliente':'party','proveedor cliente':'party','proveedor(cliente)':'party',
  'descripcion':'descripcion','detalle':'descripcion',
  'monto':'monto','importe':'monto','monto total':'monto',
  'notas':'notas','nota':'notas'
};
function normalizeHeader(h){
  return String(h==null?'':h).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\/\\_()]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function buildColMap(headerRow){
  var map = {};
  headerRow.forEach(function(h, idx){
    var field = HEADER_MAP[normalizeHeader(h)];
    if(field && map[field]==null) map[field] = idx;
  });
  return map;
}
function pad2(n){ n=String(n); return n.length<2 ? '0'+n : n; }
function excelSerialToISO(serial){
  var utcValue = (serial - 25569) * 86400;
  var d = new Date(utcValue*1000);
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
}
function parseDateFlexible(raw){
  if(raw==null || raw==='') return null;
  if(typeof raw === 'number') return excelSerialToISO(raw);
  if(raw instanceof Date) return raw.getFullYear()+'-'+pad2(raw.getMonth()+1)+'-'+pad2(raw.getDate());
  var s = String(raw).trim();
  var m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m1) return m1[1]+'-'+pad2(m1[2])+'-'+pad2(m1[3]);
  var m2 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m2) return m2[3]+'-'+pad2(m2[2])+'-'+pad2(m2[1]); // se asume DD/MM/AAAA
  return null;
}
function parseAmountFlexible(raw){
  if(raw==null || raw==='') return NaN;
  if(typeof raw === 'number') return raw;
  var s = String(raw).trim().replace(/[^0-9.,\-]/g,'');
  var lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot){ s = s.replace(/\./g,'').replace(',', '.'); }
    else { s = s.replace(/,/g,''); }
  } else if(lastComma>-1){
    s = s.replace(',', '.');
  }
  return parseFloat(s);
}
function parseCSV(text){
  var delim = (text.split('\n')[0].split(';').length > text.split('\n')[0].split(',').length) ? ';' : ',';
  var rows = []; var row = []; var field = ''; var inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === delim){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* ignorar */ }
      else { field += c; }
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });
}

function buildImportPreview(dataRows, colMap){
  return dataRows.map(function(r, i){
    var get = function(field){ return colMap[field]!=null ? r[colMap[field]] : ''; };
    var rawTipo = String(get('tipo')||'').trim().toLowerCase();
    var kind = null;
    if(['ingreso','income','i'].indexOf(rawTipo)!==-1) kind='income';
    else if(['gasto','expense','g','e'].indexOf(rawTipo)!==-1) kind='expense';
    var dateISO = parseDateFlexible(get('fecha'));
    var accName = String(get('cuenta')||'').trim();
    var account = state.accounts.find(function(a){ return a.name.trim().toLowerCase()===accName.toLowerCase(); });
    var amount = parseAmountFlexible(get('monto'));
    var categoria = String(get('categoria')||'').trim();
    var party = String(get('party')||'').trim();
    var desc = String(get('descripcion')||'').trim();
    var notas = String(get('notas')||'').trim();

    var errors = [];
    if(!kind) errors.push('Tipo inválido');
    if(!dateISO) errors.push('Fecha inválida');
    if(!accName) errors.push('Falta cuenta');
    else if(!account) errors.push('Cuenta no encontrada: "'+accName+'"');
    if(!amount || isNaN(amount) || amount<=0) errors.push('Monto inválido');
    if(!desc) errors.push('Descripción vacía');

    return {
      rowNum: i+2, kind: kind, date: dateISO, accountId: account? account.id : null, accountName: accName,
      category: categoria || (kind==='income' ? 'Otros ingresos' : (kind==='expense' ? 'Otros gastos' : '')),
      party: party, description: desc, notes: notas, amount: amount,
      errors: errors, valid: errors.length===0
    };
  });
}

function renderImportPreviewTable(rows){
  var okCount = rows.filter(function(r){ return r.valid; }).length;
  var shown = rows.slice(0,150);
  var head = '<div style="margin-bottom:8px;font-size:13.5px;"><strong>'+okCount+'</strong> de '+rows.length+' filas listas para importar'+(rows.length>shown.length?' (mostrando las primeras 150)':'')+'.</div>';
  var table = '<div class="imp-preview-wrap"><table><thead><tr><th>Fila</th><th>Fecha</th><th>Tipo</th><th>Cuenta</th><th>Monto</th><th>Descripción</th><th>Estado</th></tr></thead><tbody>'+
    shown.map(function(r){
      var badge = r.kind==='income' ? '<span class="badge badge-income">Ingreso</span>' : r.kind==='expense' ? '<span class="badge badge-expense">Gasto</span>' : '—';
      var status = r.valid ? '<span class="imp-ok">OK</span>' : '<span class="imp-err">'+esc(r.errors.join('; '))+'</span>';
      return '<tr><td>'+r.rowNum+'</td><td>'+esc(r.date||'—')+'</td><td>'+badge+'</td><td>'+esc(r.accountName||'—')+'</td><td class="num">'+(isNaN(r.amount)?'—':r.amount.toFixed(2))+'</td><td>'+esc(r.description||'—')+'</td><td>'+status+'</td></tr>';
    }).join('')+
  '</tbody></table></div>';
  return head+table+'<div class="row-actions" style="margin-top:12px;"><button class="btn btn-primary" id="btn-confirm-bulk-import" '+(okCount===0?'disabled':'')+'>Importar '+okCount+' movimientos válidos</button></div>';
}

function exportMovementsCSV(){
  var headers = ['Fecha','Tipo','Cuenta','Categoria','Proveedor_Cliente','Descripcion','Monto','Notas'];
  var rows = state.transactions
    .filter(function(t){ return t.kind==='income' || t.kind==='expense'; })
    .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); })
    .map(function(t){
      var acc = getAccount(t.accountId);
      return [
        t.date||'', t.kind==='income' ? 'Ingreso' : 'Gasto', acc ? acc.name : '',
        t.category||'', t.party||'', t.description||'', (Number(t.amount)||0).toFixed(2), t.notes||''
      ];
    });
  if(rows.length===0){ showToast('No hay movimientos para exportar todavía.'); return; }
  var lines = [headers.join(',')].concat(rows.map(function(r){
    return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  }));
  var blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'wds-finance-movimientos-'+todayISO()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  showToast(rows.length+' movimientos exportados.');
}

function downloadCSVTemplate(){
  var headers = ['Fecha','Tipo','Cuenta','Categoria','Proveedor_Cliente','Descripcion','Monto','Notas'];
  var exampleAccount = state.accounts[0] ? state.accounts[0].name : 'Cuenta Dólares';
  var example = [todayISO(),'Ingreso',exampleAccount,'Ventas','Cliente de ejemplo','Venta de contado','150.00','Ejemplo — puede borrar esta fila'];
  var lines = [headers.join(','), example.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',')];
  var blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'wds-finance-plantilla-movimientos.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function wireBulkImportSection(){
  document.getElementById('btn-export-movements').addEventListener('click', exportMovementsCSV);
  document.getElementById('btn-download-template').addEventListener('click', downloadCSVTemplate);

  var fileInput = document.getElementById('bulk-import-file');
  var statusBox = document.getElementById('bulk-import-status');
  var previewBox = document.getElementById('bulk-import-preview');
  var currentPreview = null;

  fileInput.addEventListener('change', function(){
    var file = fileInput.files[0];
    currentPreview = null;
    previewBox.innerHTML = '';
    if(!file) return;
    statusBox.textContent = 'Leyendo archivo…';
    var name = file.name.toLowerCase();

    function handleRows(allRows){
      if(allRows.length < 2){
        statusBox.textContent = 'El archivo no tiene filas de datos.';
        return;
      }
      var colMap = buildColMap(allRows[0]);
      var required = ['fecha','tipo','cuenta','monto','descripcion'];
      var missing = required.filter(function(f){ return colMap[f]==null; });
      if(missing.length>0){
        statusBox.innerHTML = 'Faltan columnas obligatorias: <strong>'+missing.join(', ')+'</strong>. Descargue la plantilla para ver el formato esperado.';
        return;
      }
      var preview = buildImportPreview(allRows.slice(1), colMap);
      currentPreview = preview;
      statusBox.textContent = '';
      previewBox.innerHTML = renderImportPreviewTable(preview);
      var confirmBtn = document.getElementById('btn-confirm-bulk-import');
      if(confirmBtn){
        confirmBtn.addEventListener('click', async function(){
          confirmBtn.disabled = true; confirmBtn.textContent = 'Importando…';
          var validRows = currentPreview.filter(function(r){ return r.valid; });
          validRows.forEach(function(r){
            if(r.kind==='income' && state.catIncome.indexOf(r.category)===-1) state.catIncome.push(r.category);
            if(r.kind==='expense' && state.catExpense.indexOf(r.category)===-1) state.catExpense.push(r.category);
            if(r.party && state.suppliers.indexOf(r.party)===-1) state.suppliers.push(r.party);
            state.transactions.push({
              id: uid(), kind: r.kind, date: r.date, accountId: r.accountId,
              category: r.category, party: r.party, amount: Math.round(r.amount*100)/100,
              description: r.description, notes: r.notes, hasImage:false
            });
          });
          await persist('catIncome'); await persist('catExpense'); await persist('suppliers'); await persist('transactions');
          ui.tab = 'movimientos';
          renderApp();
          showToast(validRows.length+' movimientos importados correctamente.');
        });
      }
    }

    if(name.endsWith('.csv')){
      var reader = new FileReader();
      reader.onload = function(e){
        try{ handleRows(parseCSV(String(e.target.result))); }
        catch(err){ statusBox.textContent = 'No se pudo leer el CSV.'; console.error(err); }
      };
      reader.readAsText(file);
    } else {
      if(typeof XLSX === 'undefined'){
        statusBox.innerHTML = 'No se pudo cargar el motor de Excel (se necesita conexión a internet la primera vez). Guarde el archivo como .csv e inténtelo de nuevo, o conecte la tablet a internet y recargue la app.';
        return;
      }
      var reader2 = new FileReader();
      reader2.onload = function(e){
        try{
          var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
          handleRows(rows);
        }catch(err){ statusBox.textContent = 'No se pudo leer el archivo de Excel.'; console.error(err); }
      };
      reader2.readAsArrayBuffer(file);
    }
  });
}

function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 900, w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.65));
    };
    img.onerror = function(){ showToast('No se pudo procesar la imagen.'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openTxModal(opts){
  opts = opts || {};
  var type = opts.type || 'income';
  var editing = opts.editing || null;
  modalState = { pendingImage: null, preserved:{} };

  // preservar valores comunes al cambiar de tipo dentro del modal (sin volver a abrir editando)
  if(!editing){
    var dEl = document.getElementById('f-date');
    var nEl = document.getElementById('f-notes');
    var amEl = document.getElementById('f-amount');
    if(dEl) modalState.preserved.date = dEl.value;
    if(nEl) modalState.preserved.notes = nEl.value;
    if(amEl) modalState.preserved.amount = amEl.value;
  }

  var root = document.getElementById('modal-root');
  root.innerHTML = buildTxModalHtml(type, editing);
  root.classList.add('open');
  wireTxModal(type, editing);

  if(editing && editing.hasImage){
    getImage(editing.id).then(function(dataUrl){
      if(dataUrl){
        modalState.pendingImage = null; // sin cambios, ya existe
        var prev = document.getElementById('f-image-preview');
        if(prev) prev.innerHTML = '<div class="img-preview"><img src="'+dataUrl+'"><button type="button" class="btn-link" id="f-image-remove">Quitar imagen</button></div>';

        if(rm) rm.addEventListener('click', function(){
          modalState.pendingImage = 'REMOVE';
          document.getElementById('f-image-preview').innerHTML = '';
        });
      }
    });
  }
}

      '<div class="field"><label>Imagen de respaldo (opcional)</label><input type="file" accept="image/*" id="f-image"><div id="f-image-preview"></div></div>'+
    '</form>'+
    '<div class="modal-foot"><button type="button" class="btn" id="tx-cancel">Cancelar</button><button type="button" class="btn btn-primary" id="tx-save">Guardar</button></div>'+
  '</div>';
}

function rebuildSelectOptions(selectId, list, selectValue){
  var sel = document.getElementById(selectId);
  if(!sel) return;
  var opts = list.map(function(v){ return '<option value="'+esc(v)+'" '+(v===selectValue?'selected':'')+'>'+esc(v)+'</option>'; }).join('');
  if(selectId==='f-category') opts += '<option value="__new__">+ Agregar nueva…</option>';
  if(selectId==='f-party') sel.innerHTML = '<option value="">— Ninguno —</option>'+opts+'<option value="__new__">+ Agregar nueva…</option>';
  else sel.innerHTML = opts;
  sel.value = selectValue;
}

function wireTxModal(type, editing){
  document.querySelectorAll('[data-switch-type]').forEach(function(btn){
    btn.addEventListener('click', function(){
      // preservar campos comunes antes de reconstruir
      var d=document.getElementById('f-date'), n=document.getElementById('f-notes'), am=document.getElementById('f-amount');
      modalState.preserved = { date: d?d.value:'', notes: n?n.value:'', amount: am?am.value:'' };
      openTxModal({type: btn.getAttribute('data-switch-type'), editing: editing});
    });
  });
  document.getElementById('tx-cancel').addEventListener('click', closeModal);

  if(type==='income' || type==='expense'){
    var accSel = document.getElementById('f-account');
    accSel.addEventListener('change', function(){
      var acc = getAccount(this.value);
      document.getElementById('f-currency-label').textContent = acc? acc.currency : '';
    });
    var catSel = document.getElementById('f-category');
    catSel.addEventListener('change', function(){
      document.getElementById('f-newcat-box').style.display = this.value==='__new__' ? 'flex' : 'none';
    });
    document.getElementById('f-newcat-add-btn').addEventListener('click', async function(){
      var input = document.getElementById('f-newcat-input');
      var val = input.value.trim();
      if(!val) return;
      var list = type==='income' ? state.catIncome : state.catExpense;
      if(list.indexOf(val)===-1) list.push(val);
      await persist(type==='income'?'catIncome':'catExpense');
      rebuildSelectOptions('f-category', list, val);
      document.getElementById('f-newcat-box').style.display='none';
      input.value='';
    });
    var partySel = document.getElementById('f-party');
    partySel.addEventListener('change', function(){
      document.getElementById('f-newparty-box').style.display = this.value==='__new__' ? 'flex' : 'none';
    });
    document.getElementById('f-newparty-add-btn').addEventListener('click', async function(){
      var input = document.getElementById('f-newparty-input');
      var val = input.value.trim();
      if(!val) return;
      if(state.suppliers.indexOf(val)===-1) state.suppliers.push(val);
      await persist('suppliers');
      rebuildSelectOptions('f-party', state.suppliers, val);
      document.getElementById('f-newparty-box').style.display='none';
      input.value='';
    });
  } else {
    ['f-from','f-to','f-amount','f-rate'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.addEventListener('input', updateTransferCalc);
    });
    document.getElementById('f-from').addEventListener('change', updateTransferCalc);
    document.getElementById('f-to').addEventListener('change', updateTransferCalc);
    var manualCb = document.getElementById('f-manual-dest');
    if(manualCb) manualCb.addEventListener('change', updateTransferCalc);
    updateTransferCalc();
  }

  var imgInput = document.getElementById('f-image');
  imgInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    compressImage(file, function(dataUrl){
      modalState.pendingImage = dataUrl;
      var prev = document.getElementById('f-image-preview');
      prev.innerHTML = '<div class="img-preview"><img src="'+dataUrl+'"><button type="button" class="btn-link" id="f-image-remove">Quitar imagen</button></div>';
      document.getElementById('f-image-remove').addEventListener('click', function(){
        modalState.pendingImage = 'REMOVE';
        prev.innerHTML = '';
        imgInput.value = '';
      });
    });
  });

  document.getElementById('tx-save').addEventListener('click', function(){ handleTxSave(type, editing ? editing.id : null); });
}

function updateTransferCalc(){
  var fromAcc = getAccount(document.getElementById('f-from').value);
  var toAcc = getAccount(document.getElementById('f-to').value);
  var manualWrap = document.getElementById('f-manual-toggle-wrap');
  var rateWrap = document.getElementById('f-rate-wrap');
  var destDisplay = document.getElementById('f-destamount-display');
  var destInput = document.getElementById('f-destamount-input');
  var destCurLabel = document.getElementById('f-destcurrency-label');
  var manualCb = document.getElementById('f-manual-dest');
  var amount = parseFloat(document.getElementById('f-amount').value) || 0;

  document.getElementById('f-currency-label').textContent = fromAcc ? fromAcc.currency : '';
  if(destCurLabel) destCurLabel.textContent = toAcc ? toAcc.currency : '';

  var cross = fromAcc && toAcc && fromAcc.currency !== toAcc.currency;
  if(!cross){
    manualWrap.style.display = 'none';
    rateWrap.style.display = 'none';
    if(manualCb) manualCb.checked = false;
    destDisplay.style.display = 'inline-block';
    destInput.style.display = 'none';
    if(fromAcc && toAcc) destDisplay.textContent = fmtCurrency(amount, toAcc.currency);
    return;
  }
  manualWrap.style.display = 'block';
  var manual = manualCb && manualCb.checked;
  if(manual){
    rateWrap.style.display = 'none';
    destDisplay.style.display = 'none';
    destInput.style.display = 'block';
  } else {
    rateWrap.style.display = 'block';
    destDisplay.style.display = 'inline-block';
    destInput.style.display = 'none';
    var rate = parseFloat(document.getElementById('f-rate').value) || 0;
    destDisplay.textContent = fmtCurrency(amount*rate, toAcc.currency);
  }
}

async function handleTxSave(type, editingId){
  var root = document.getElementById('modal-root');
  clearFieldErrors(root);
  var date = document.getElementById('f-date').value;
  var notes = document.getElementById('f-notes').value.trim();
  if(!date){ setFieldError('f-date','Seleccione una fecha.'); return; }

  var record = { id: editingId || uid(), kind: type, date: date, notes: notes };

  if(type==='income' || type==='expense'){
    var accountId = document.getElementById('f-account').value;
    var category = document.getElementById('f-category').value;
    var partyEl = document.getElementById('f-party');
    var party = partyEl.value;
    var amount = parseFloat(document.getElementById('f-amount').value);
    var desc = document.getElementById('f-desc').value.trim();
    var ok = true;
    if(!accountId){ setFieldError('f-account','Seleccione una cuenta.'); ok=false; }
    if(!category || category==='__new__'){ setFieldError('f-category','Seleccione o agregue una categoría.'); ok=false; }
    if(!amount || amount<=0 || isNaN(amount)){ setFieldError('f-amount','Ingrese un monto válido.'); ok=false; }
    if(!desc){ setFieldError('f-desc','Ingrese una descripción.'); ok=false; }
    if(!ok) return;
    record.accountId = accountId;
    record.category = category;
    record.party = (party==='__new__' || !party) ? '' : party;
    record.amount = Math.round(amount*100)/100;
    record.description = desc;
  } else {
    var fromId = document.getElementById('f-from').value;
    var toId = document.getElementById('f-to').value;
    var amt = parseFloat(document.getElementById('f-amount').value);
    var ok2 = true;
    if(!fromId || !toId || fromId===toId){ setFieldError('f-to','Elija cuentas distintas.'); ok2=false; }
    if(!amt || amt<=0 || isNaN(amt)){ setFieldError('f-amount','Ingrese un monto válido.'); ok2=false; }
    var fromAcc = getAccount(fromId), toAcc = getAccount(toId);
    var destAmount = amt, rate = null, isManual = false;
    if(fromAcc && toAcc && fromAcc.currency !== toAcc.currency){
      var manualCb = document.getElementById('f-manual-dest');
      isManual = !!(manualCb && manualCb.checked);
      if(isManual){
        var destVal = parseFloat(document.getElementById('f-destamount-input').value);
        if(!destVal || destVal<=0 || isNaN(destVal)){ setFieldError('f-destamount-input','Ingrese un monto válido.'); ok2=false; }
        else destAmount = Math.round(destVal*100)/100;
      } else {
        rate = parseFloat(document.getElementById('f-rate').value);
        if(!rate || rate<=0 || isNaN(rate)){ setFieldError('f-rate','Ingrese un tipo de cambio válido.'); ok2=false; }
        else destAmount = Math.round(amt*rate*100)/100;
      }
    }
    if(!ok2) return;
    var descEl = document.getElementById('f-desc');
    record.accountId = fromId;
    record.toAccountId = toId;
    record.amount = Math.round(amt*100)/100;
    record.destAmount = destAmount;
    record.rate = rate;
    record.manualDest = isManual;
    record.description = (descEl && descEl.value.trim()) ? descEl.value.trim() : 'Transferencia entre cuentas';
  }

  var pendingImage = modalState.pendingImage;
  var hadImage = editingId ? !!((state.transactions.find(function(t){return t.id===editingId;})||{}).hasImage) : false;
  record.hasImage = pendingImage === 'REMOVE' ? false : (pendingImage ? true : hadImage);

  if(editingId){
    var idx = state.transactions.findIndex(function(t){ return t.id===editingId; });
    if(idx>-1) state.transactions[idx] = record;
  } else {
    state.transactions.push(record);
  }
  await persist('transactions');
  if(pendingImage && pendingImage!=='REMOVE'){ await saveImage(record.id, pendingImage); }
  if(pendingImage==='REMOVE'){ await deleteImageKey(record.id); }

  closeModal();
  renderApp();
  showToast(editingId ? 'Movimiento actualizado.' : 'Movimiento guardado.');
}

/* ---------------------------------------------------------
   CALCULADORA
--------------------------------------------------------- */
var calcState = { display:'0', prevValue:null, operator:null, resetNext:false };

function calcFormatResult(n){
  if(isNaN(n) || !isFinite(n)) return 'Error';
  var rounded = Math.round(n*1e8)/1e8;
  return String(rounded);
}
function calcRenderDisplay(){
  var d = document.getElementById('calc-display');
  if(d) d.textContent = calcState.display;
}
function calcInputDigit(d){
  if(calcState.display==='Error' || calcState.resetNext){ calcState.display = d; calcState.resetNext = false; }
  else { calcState.display = (calcState.display==='0') ? d : calcState.display + d; }
  calcRenderDisplay();
}
function calcInputDecimal(){
  if(calcState.display==='Error' || calcState.resetNext){ calcState.display = '0.'; calcState.resetNext = false; calcRenderDisplay(); return; }
  if(calcState.display.indexOf('.')===-1){ calcState.display += '.'; }
  calcRenderDisplay();
}
function calcClear(){
  calcState = { display:'0', prevValue:null, operator:null, resetNext:false };
  calcRenderDisplay();
}
function calcBackspace(){
  if(calcState.resetNext || calcState.display==='Error'){ return; }
  calcState.display = calcState.display.length>1 ? calcState.display.slice(0,-1) : '0';
  calcRenderDisplay();
}
function calcCompute(){
  if(calcState.operator==null || calcState.prevValue==null) return;
  var cur = parseFloat(calcState.display);
  var result;
  switch(calcState.operator){
    case '+': result = calcState.prevValue + cur; break;
    case '-': result = calcState.prevValue - cur; break;
    case '×': result = calcState.prevValue * cur; break;
    case '÷': result = cur===0 ? NaN : calcState.prevValue / cur; break;
    default: result = cur;
  }
  calcState.display = calcFormatResult(result);
  calcState.operator = null;
  calcState.prevValue = null;
  calcState.resetNext = true;
  calcRenderDisplay();
}
function calcSetOperator(op){
  if(calcState.operator && !calcState.resetNext){ calcCompute(); }
  calcState.prevValue = parseFloat(calcState.display);
  calcState.operator = op;
  calcState.resetNext = true;
  calcRenderDisplay();
}
function calcPercent(){
  var cur = parseFloat(calcState.display);
  var result = (calcState.operator && calcState.prevValue!=null) ? calcState.prevValue * (cur/100) : cur/100;
  calcState.display = calcFormatResult(result);
  calcState.resetNext = true;
  calcRenderDisplay();
}

function buildCalcModalHtml(){
  return '<div class="modal-panel calc-panel">'+
    '<h3>Calculadora</h3>'+
    '<div class="calc-display num" id="calc-display">'+esc(calcState.display)+'</div>'+
    '<div class="calc-grid">'+
      '<button type="button" class="calc-btn calc-op" data-calc="clear">C</button>'+
      '<button type="button" class="calc-btn calc-op" data-calc="back">⌫</button>'+
      '<button type="button" class="calc-btn calc-op" data-calc="percent">%</button>'+
      '<button type="button" class="calc-btn calc-op" data-calc="op" data-op="÷">÷</button>'+

      '<button type="button" class="calc-btn" data-calc="digit" data-d="7">7</button>'+
      '<button type="button" class="calc-btn" data-calc="digit" data-d="8">8</button>'+
      '<button type="button" class="calc-btn" data-calc="digit" data-d="9">9</button>'+
      '<button type="button" class="calc-btn calc-op" data-calc="op" data-op="×">×</button>'+

      '<button type="button" class="calc-btn" data-calc="digit" data-d="4">4</button>'+
      '<button type="button" class="calc-btn" data-calc="digit" data-d="5">5</button>'+
      '<button type="button" class="calc-btn" data-calc="digit" data-d="6">6</button>'+
      '<button type="button" class="calc-btn calc-op" data-calc="op" data-op="-">-</button>'+

      '<button type="button" class="calc-btn" data-calc="digit" data-d="1">1</button>'+
      '<button type="button" class="calc-btn" data-calc="digit" data-d="2">2</button>'+
      '<button type="button" class="calc-btn" data-calc="digit" data-d="3">3</button>'+
      '<button type="button" class="calc-btn calc-op" data-calc="op" data-op="+">+</button>'+

      '<button type="button" class="calc-btn calc-zero" data-calc="digit" data-d="0">0</button>'+
      '<button type="button" class="calc-btn" data-calc="decimal">.</button>'+
      '<button type="button" class="calc-btn calc-eq" data-calc="equals">=</button>'+
    '</div>'+
    '<div class="modal-foot"><button type="button" class="btn" id="calc-close">Cerrar</button></div>'+
  '</div>';
}

function wireCalcModal(){
  document.querySelectorAll('[data-calc]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var action = btn.getAttribute('data-calc');
      if(action==='digit') calcInputDigit(btn.getAttribute('data-d'));
      else if(action==='decimal') calcInputDecimal();
      else if(action==='clear') calcClear();
      else if(action==='back') calcBackspace();
      else if(action==='percent') calcPercent();
      else if(action==='op') calcSetOperator(btn.getAttribute('data-op'));
      else if(action==='equals') calcCompute();
    });
  });
  document.getElementById('calc-close').addEventListener('click', closeModal);
}

function openCalculatorModal(){
  calcState = { display:'0', prevValue:null, operator:null, resetNext:false };
  var root = document.getElementById('modal-root');
  root.innerHTML = buildCalcModalHtml();
  root.classList.add('open');
  wireCalcModal();
}

   Arranque
--------------------------------------------------------- */
(async function init(){
  await loadState();
  renderApp();
  setTimeout(maybeAutoBackupToDevice, 1500);
})();
